name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      # Publish only what belongs on the public site. Everything else in the
      # repo (design notes, data sources, README) stays out of the deploy.
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          mkdir -p _site/content
          cp content/*.js content/*.css _site/content/
          cp og.svg _site/og.svg
          mkdir -p _site/reconstruction
          cp reconstruction/index.html _site/reconstruction/index.html
          mkdir -p _site/data
          cp data/cns-delivery.json _site/data/cns-delivery.json
          # The machine-readable graph: bulk exports and the JSON Schemas.
          mkdir -p _site/graph
          cp -r public/graph/. _site/graph/
          echo "Assembled:"; find _site -type f

      # Auth: the account-wide Global API Key + login email (owner's decision, 2026-09-11:
      # one credential shared across every project and session, pasted once per repo).
      # wrangler reads CLOUDFLARE_API_KEY / CLOUDFLARE_EMAIL from the environment.
      - name: Deploy
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy _site --project-name=human-repair-map --branch=main --commit-dirty=true
