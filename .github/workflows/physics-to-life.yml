name: Physics-to-Life tests

on:
  push:
    branches: [main]
    paths: ["physics-to-life/**"]
  pull_request:
    paths: ["physics-to-life/**"]
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: physics-to-life
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Install
        run: pip install -e ".[dev]"
      - name: Unit tests
        run: python -m pytest -q
      - name: Pipeline smoke test
        run: python experiments/v0_toy/run.py --smoke --run-id ci-smoke --n-proc 2
