name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      # Generated live data (graph/activity.json, graph/feed.json) is not committed; keep the
      # copies already on the site so a records change does not blank them until the next
      # nightly run (live-data.yml).
      - name: Carry over live data
        run: bash scripts/fetch-live-data.sh

      # Publish only what belongs on the public site (see scripts/assemble-site.sh).
      - name: Assemble site
        run: bash scripts/assemble-site.sh

      # Auth: the account-wide Global API Key + login email (owner's decision, 2026-09-11:
      # one credential shared across every project and session, pasted once per repo).
      # wrangler reads CLOUDFLARE_API_KEY / CLOUDFLARE_EMAIL from the environment.
      - name: Deploy
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy _site --project-name=human-repair-map --branch=main --commit-dirty=true
