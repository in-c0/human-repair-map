name: Validate records

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      # Fails on any invalid record: schema violation, dangling reference,
      # dependency cycle, a grade with no claim behind it, a "reviewed" record
      # without a named human reviewer.
      - name: Validate and rebuild
        run: node scripts/build.mjs

      # The guard that closes the drift class: if the committed generated files
      # differ from what the records produce, the site, the API or the bulk
      # export is serving something the data does not say.
      - name: Fail if generated files are stale
        run: |
          if ! git diff --quiet -- content/records.js mcp/src/generated.js public/graph; then
            echo "::error::Generated files are out of date with records/."
            echo "Run 'node scripts/build.mjs' and commit the result."
            git --no-pager diff --stat -- content/records.js mcp/src/generated.js public/graph
            exit 1
          fi
          echo "Generated files match records/."

      # The worker's fetch handler, exercised end to end in node against an
      # in-memory D1 shim: MCP handshake, every graph tool, the REST routes,
      # prediction registration, and the hash-chain negative control.
      - name: Test the MCP/API worker
        run: node mcp/test.mjs
