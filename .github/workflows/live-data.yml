name: Live data (who is working on this, what changed)

# Nightly. Regenerates graph/activity.json (recent papers and active trials per record) and
# runs the feed (scripts/feed.mjs): new items go into graph/feed.json, and the strong ones
# are filed as proposals at /api/proposals, which the bridge turns into draft pull requests.
# The results are deployed to the site, not committed: records are the only thing that
# changes by commit.

on:
  schedule:
    - cron: "40 15 * * *"   # 01:40 Sydney (AEST)
  workflow_dispatch:

jobs:
  live:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - name: Fetch the previous feed state from the site
        run: bash scripts/fetch-live-data.sh && rm -f public/graph/activity.json
      - name: Who is working on this (Europe PMC + ClinicalTrials.gov)
        run: node scripts/activity.mjs
      - name: What changed (digest + proposals)
        run: node scripts/feed.mjs
      - name: Assemble site
        run: bash scripts/assemble-site.sh
      - name: Deploy
        env:
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy _site --project-name=human-repair-map --branch=main --commit-dirty=true
